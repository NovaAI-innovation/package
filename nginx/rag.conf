server {
    listen 80 default_server;
    server_name _;
    return 404;
}

server {
    listen 80;
    server_name rag.psykonic.com;

    location = /mcp {
        # Resolve the service again if Compose replaces the MCP container.
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $mcp_upstream mcp:8765;
        proxy_pass http://$mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $mcp_upstream;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_request_buffering off;
    }

    location / {
        return 404;
    }
}
