[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "knowledge-schema"
version = "1.0.0"
description = "Deployment and acceptance tooling for the AI-agents knowledge platform schema (release 1.0.0)"
requires-python = ">=3.11"
dependencies = [
  "psycopg[binary]>=3.1",
  "httpx>=0.27",
  "falkordb>=1.0",
  "python-dotenv>=1,<2",
  "mcp>=1.27.2,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ks = "ks.cli:main"
ks-mcp = "ks.mcp_server:main"

[tool.setuptools]
packages = ["ks", "ks.stores", "ks.checks"]

[tool.setuptools.package-data]
ks = ["../db/postgres/*.sql", "../db/surrealdb/*.surql", "../db/falkordb/*", "../db/prelude/*.sql"]

[tool.pytest.ini_options]
testpaths = ["tests"]
